name: echo_sign
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  local_auth: ^3.0.2
  http: ^1.6.0
  file_picker: 10.3.8
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  video_player: ^2.11.1
  record: ^6.1.2
  path_provider: ^2.1.3
  camera: ^0.11.0
  flutter_tts: ^4.2.5



  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  permission_handler: 12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/sign_videos/